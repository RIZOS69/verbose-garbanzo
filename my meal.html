<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Foodie App - 3º ESO LOMLOE/DUA</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #2ECC71;
            --danger-color: #E74C3C;
            --bg-color: #F5F7FA;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Estructura del Dispositivo/Tablet */
        .app-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 4px solid #333;
            display: flex;
            flex-direction: column;
            min-height: 550px;
        }

        /* Barra Superior */
        .app-header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            position: relative;
        }

        .btn-nav {
            position: absolute;
            left: 15px;
            top: 12px;
            background: #555;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Pantallas */
        .screen {
            display: none;
            padding: 25px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pantalla 1: Perfiles */
        .profile-box {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }

        .btn-profile {
            flex: 1;
            padding: 30px;
            border: 3px solid #DDD;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-profile:hover {
            transform: scale(1.03);
            border-color: var(--primary-color);
        }

        .btn-profile img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* Elementos del correo (Reading) */
        .email-box {
            width: 100%;
            border: 2px solid #EEE;
            border-radius: 10px;
            margin: 15px 0;
            background: #FAFAFA;
        }

        .email-header {
            background: #EEE;
            padding: 10px;
            font-size: 0.9rem;
            border-bottom: 2px solid #DDD;
        }

        .email-body {
            padding: 20px;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .clickable-word {
            background-color: #FFF2CC;
            border-bottom: 2px dashed #F39C12;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Ventanas Emergentes (Popups DUA) */
        .modal-dua {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
            border: 3px solid var(--primary-color);
        }

        .modal-dua img {
            max-width: 200px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        /* Botones de acción */
        .btn-next {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Quiz Grid */
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .btn-option {
            padding: 15px;
            border: 2px solid #CCC;
            border-radius: 10px;
            background: white;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        /* Feedback colores DUA */
        .correct-ans {
            background-color: #D4EDDA !important;
            border-color: var(--success-color) !important;
            color: #155724;
        }

        .incorrect-ans {
            background-color: #F8D7DA !important;
            border-color: var(--danger-color) !important;
            color: #721C24;
        }

        .audio-btn {
            background: #E6F2FF;
            border: 1px solid var(--primary-color);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

            <button class="btn-next" id="btn-finish" style="display:none;" onclick="finishQuiz()">Finalizar Actividad 🎉</button>
        </div>
    </div>

    <!-- Elementos del Modal DUA (Imágenes Emergentes) -->
    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal-dua" id="modal-dua">
        <h3 id="modal-title">Elemento</h3>
        <img id="modal-img" src="" alt="Imagen de soporte visual">
        <br>
        <button onclick="closeModal()">Cerrar</button>
    </div>
